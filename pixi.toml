[project]
name = "chebfunjax"
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
numpy = ">=1.24"
scipy = ">=1.11"
matplotlib = ">=3.7"
pytest = ">=7.0"
pytest-xdist = "*"
pytest-cov = "*"
pytest-timeout = "*"
ruff = "*"
mkdocs = "*"
mkdocs-material = "*"
scikit-image = ">=0.26.0,<0.27"
mpmath = ">=1.4.1,<2"
finufft = ">=2.5.1,<3"

# JAX with CUDA support
[pypi-dependencies]
jax = { version = ">=0.4.20", extras = ["cuda12"] }
equinox = ">=0.11"
chebfunjax = { path = ".", editable = true }

[tasks]
# --timeout guards against constructor hangs (a Ballfun loop once burned
# 6h CI runs); -n auto uses all cores via pytest-xdist.
test-fast = "python -m pytest tests/ -m 'not slow and not gpu and not matlab' -q --tb=short --timeout=900 -n auto"
test-full = "python -m pytest tests/ -q --tb=short --timeout=900 -n auto --cov=chebfunjax --cov-report=term-missing"
# CI runners (4 vCPU / 16 GB) OOM with -n auto: each xdist worker
# accumulates a JAX JIT cache over 3000+ tests. Two workers keep the
# peak under control; per-test timeout is tighter to fail fast.
test-ci = "python -m pytest tests/ --ignore=tests/test_matlab_port -q --tb=short --timeout=600 -n 2 --cov=chebfunjax --cov-report=term"
test-matlab-port = "python -m pytest tests/test_matlab_port -q --tb=short --timeout=900 -p no:cacheprovider"
test-gpu = "python -m pytest tests/ -m gpu -v --tb=short --timeout=900"
test-matlab = "python -m pytest tests/ -m matlab -q --tb=short --timeout=900 -n auto"
check-jax = "python -c \"import jax; print('JAX devices:', jax.devices())\""
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
smoke = "python -c \"import chebfunjax; print('chebfunjax imported OK')\""
generate-plots = "python examples/generate_all_plots.py"
