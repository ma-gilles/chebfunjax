name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI is the sole reviewer. If all jobs pass, the PR is safe to auto-merge.
# Configure branch protection to require all these jobs (scripts/setup-branch-protection.sh).

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No numpy imports in library code
        run: |
          # Files may opt out with a "# uses-numpy:" comment (for non-JIT algorithms
          # like rootfinding and AAA that legitimately need numpy/scipy).
          FAIL=0
          for f in $(grep -rln "^import numpy\|^from numpy" src/ --include="*.py" | grep -v "jax.numpy"); do
            if ! grep -q "# uses-numpy:" "$f"; then
              echo "FAIL: $f imports numpy without '# uses-numpy: <reason>' comment"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "OK: All numpy imports are justified or absent."
          exit $FAIL

      - name: Provenance docstrings present
        run: |
          MISSING=""
          for f in $(find src/chebfunjax -name "*.py" ! -name "__init__.py" ! -name "_*" -size +100c); do
            if ! grep -q "Provenance" "$f"; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo -e "FAIL: Missing Provenance section in:$MISSING"
            exit 1
          fi
          echo "OK: All source files have Provenance docstrings."

      - name: Golden refs committed for MATLAB tests
        run: |
          pip install -q scipy numpy
          python -c "
          from pathlib import Path
          import re, sys

          test_dir = Path('tests')
          ref_dir = test_dir / 'references'
          refs = {f.stem for f in ref_dir.glob('*.mat')}

          needed = set()
          for tf in test_dir.rglob('test_*.py'):
              text = tf.read_text()
              if 'pytest.mark.matlab' in text:
                  for m in re.finditer(r'load_matlab_ref\([\"\\'](\w+)\.mat', text):
                      needed.add(m.group(1))
                  for m in re.finditer(r'\"matlab_ref\",\s*\[\"(\w+)\"\]', text):
                      needed.add(m.group(1))
                  # Match fixture parameters like (self, matlab_quadrature) but not
                  # method names like def test_vs_matlab_cheb(self, ...)
                  for m in re.finditer(r'(?:,\s*|def\s+)matlab_(\w+)\s*[,\)]', text):
                      name = m.group(1)
                      if name not in ('ref',) and not name.startswith('test'):
                          needed.add(name)

          missing = needed - refs
          if missing:
              print('FAIL: MATLAB tests need these uncommitted refs:')
              for m in sorted(missing):
                  print(f'  tests/references/{m}.mat')
              sys.exit(1)
          print(f'OK: {len(needed)} golden refs verified ({len(refs)} committed).')
          "

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    # Core suite (excl. the MATLAB port tree, which has its own job
    # below -- running both in one job overwhelmed hosted runners).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Run core tests with coverage
        run: pixi run test-ci

  # The port tree is sharded: one job exceeded the GitHub runner's
  # memory (JAX's in-process jit cache grows monotonically across
  # thousands of tests) -- serial and -n 2 both died with
  # "The operation was canceled" and zero failing tests.
  matlab-port:
    name: MATLAB port tree (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: chebfun
            paths: >-
              tests/test_matlab_port/chebfun
              tests/test_matlab_port/misc
              tests/test_matlab_port/cheb
              tests/test_matlab_port/domain
              tests/test_matlab_port/chebpref
              tests/test_matlab_port/adchebfun
              tests/test_matlab_port/treeVar
          - name: techs-2d3d
            paths: >-
              tests/test_matlab_port/chebtech
              tests/test_matlab_port/chebtech1
              tests/test_matlab_port/chebtech2
              tests/test_matlab_port/trigtech
              tests/test_matlab_port/trigspec
              tests/test_matlab_port/fun
              tests/test_matlab_port/classicfun
              tests/test_matlab_port/bndfun
              tests/test_matlab_port/unbndfun
              tests/test_matlab_port/singfun
              tests/test_matlab_port/deltafun
              tests/test_matlab_port/chebfun2
              tests/test_matlab_port/chebfun2v
              tests/test_matlab_port/chebfun3
              tests/test_matlab_port/chebfun3t
              tests/test_matlab_port/chebfun3v
          - name: geometry-ops
            paths: >-
              tests/test_matlab_port/spherefun
              tests/test_matlab_port/spherefunv
              tests/test_matlab_port/diskfun
              tests/test_matlab_port/diskfunv
              tests/test_matlab_port/ballfun
              tests/test_matlab_port/ballfunv
              tests/test_matlab_port/chebop
              tests/test_matlab_port/chebop2
              tests/test_matlab_port/linop
              tests/test_matlab_port/chebmatrix
              tests/test_matlab_port/operatorBlock
              tests/test_matlab_port/functionalBlock
              tests/test_matlab_port/spinop
              tests/test_matlab_port/spinop2
              tests/test_matlab_port/spinop3
              tests/test_matlab_port/spinopsphere
              tests/test_matlab_port/spinpref
              tests/test_matlab_port/spinpref2
              tests/test_matlab_port/spinpref3
              tests/test_matlab_port/spinprefsphere
              tests/test_matlab_port/spinscheme
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Run MATLAB test-suite ports
        run: >-
          pixi run python -m pytest ${{ matrix.shard.paths }}
          -q --tb=short --timeout=900 -p no:cacheprovider
      - name: Check shard covers no stray directories
        if: matrix.shard.name == 'chebfun'
        run: python scripts/check_port_shards.py

  golden-refs:
    name: Validate golden refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate .mat files
        run: |
          pip install -q scipy numpy
          python -c "
          from pathlib import Path
          import scipy.io
          refs = list(Path('tests/references').glob('*.mat'))
          assert len(refs) > 0, 'No golden refs found'
          for f in sorted(refs):
              d = scipy.io.loadmat(str(f), squeeze_me=True)
              keys = [k for k in d if not k.startswith('__')]
              print(f'{f.name}: {len(keys)} fields')
          print(f'OK: {len(refs)} golden ref files validated')
          "
